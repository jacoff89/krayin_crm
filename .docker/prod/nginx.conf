# Внутренний nginx прода: только HTTP на 80 порту.
# SSL терминируется на головном nginx, который проксирует сюда и передаёт
# заголовки X-Forwarded-* — nginx пробрасывает их в PHP как есть,
# а Laravel доверяет им через trustProxies (см. bootstrap/app.php, TRUSTED_PROXIES).

log_format proxied '$http_x_forwarded_for ($remote_addr) - [$time_local] "$request" '
                   '$status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    access_log /var/log/nginx/access.log proxied;

    root /var/www/html/public;
    index index.php;
    charset utf-8;

    client_max_body_size 100M;
    server_tokens off;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # собранные vite-ассеты имеют хэш в имени — можно кэшировать надолго
    location ~ ^/(.+/)?build/assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
        try_files $uri =404;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
        fastcgi_read_timeout 300;
    }

    # скрытые файлы (.env, .git и т.п.), кроме .well-known
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
