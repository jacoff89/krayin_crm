# Прод-окружение crm.aquastyle74.ru
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
#
# Отличия от docker-compose.yml (dev):
#  - nginx слушает только 127.0.0.1 — снаружи доступ лишь через головной nginx с SSL
#  - убран port-proxy: MySQL не торчит наружу
#  - php-fpm получает прод-настройки PHP и OPcache (монтируются, образ не меняется)
#  - healthcheck для БД, php-fpm стартует только после готовности MySQL
#  - ротация логов контейнеров, чтобы не забить диск

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: crm-nginx
    working_dir: /var/www/html
    depends_on:
      - php-fpm
    volumes:
      - .:/var/www/html:ro
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

  php-fpm:
    container_name: crm-php-fpm
    build:
      context: .docker/php-fpm
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/var/www/html
      - ./.docker/php-fpm/php-prod.ini:/etc/php/8.4/fpm/conf.d/99-prod.ini:ro
    depends_on:
      db:
        condition: service_healthy
      postfix-opendkim:
        condition: service_started
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

  db:
    container_name: crm-db
    image: mysql:8.4
    volumes:
      - crm-db-data:/var/lib/mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Задай DB_ROOT_PASSWORD в .env}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Задай DB_PASSWORD в .env}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

  postfix-opendkim:
    container_name: crm-postfix-opendkim
    build: .docker/postfix-opendkim
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

volumes:
  crm-db-data:

networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}