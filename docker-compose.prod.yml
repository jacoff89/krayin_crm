# Прод-окружение crm.aquastyle74.ru
# Запуск: docker compose -f docker-compose.prod.yml up -d --build
#
# Отличия от docker-compose.yml (dev):
#  - nginx слушает только 127.0.0.1 — снаружи доступ лишь через головной nginx с SSL
#  - убран port-proxy: MySQL не торчит наружу
#  - php-fpm получает прод-настройки PHP и OPcache (монтируются, образ не меняется)
#  - healthcheck для БД, php-fpm стартует только после готовности MySQL
#  - ротация логов контейнеров, чтобы не забить диск

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  nginx:
    image: nginx:1.27-alpine
    container_name: krayin_crm-nginx
    working_dir: /var/www/html
    depends_on:
      - php-fpm
    volumes:
      - .:/var/www/html:ro
      - ./.docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${NGINX_BIND:-127.0.0.1}:${NGINX_PORT:-8080}:80"
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

  php-fpm:
    container_name: krayin_crm-php-fpm
    build:
      context: .docker/php-fpm
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/var/www/html
      - ./.docker/php-fpm/php-prod.ini:/etc/php/8.4/fpm/conf.d/99-prod.ini:ro
    depends_on:
      postfix-opendkim:
        condition: service_started
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

  postfix-opendkim:
    container_name: krayin_crm-postfix-opendkim
    build: .docker/postfix-opendkim
    networks:
      - mailnet
    restart: unless-stopped
    logging: *default-logging

networks:
  mailnet:
    driver: bridge
    ipam:
      config:
        - subnet: ${NETWORK_SUBNET}